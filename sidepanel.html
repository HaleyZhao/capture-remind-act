<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capture Remind Act</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app">
    <main class="content">
      <section class="section briefing" aria-labelledby="briefing-heading">
        <h2 class="section__title" id="briefing-heading">Daily Briefing</h2>
        <div class="briefing__card" id="briefing-content"></div>
      </section>

      <section class="section" aria-labelledby="today-heading">
        <div class="section__header">
          <h2 class="section__title" id="today-heading">Today</h2>
          <span class="section__count" id="today-count"></span>
        </div>
        <ul class="item-list" id="today-list"></ul>
        <p class="empty-state" id="today-empty">Nothing for today.</p>
      </section>

      <section class="section" aria-labelledby="waiting-heading">
        <div class="section__header">
          <h2 class="section__title" id="waiting-heading">Waiting On</h2>
          <span class="section__count" id="waiting-count"></span>
        </div>
        <ul class="item-list" id="waiting-list"></ul>
        <p class="empty-state" id="waiting-empty">Nothing waiting on others.</p>
      </section>

      <section class="section" aria-labelledby="recent-heading">
        <div class="section__header">
          <h2 class="section__title" id="recent-heading">Recent</h2>
          <span class="section__count" id="recent-count"></span>
        </div>
        <ul class="recent-list" id="recent-list"></ul>
        <p class="empty-state" id="recent-empty">Nothing captured yet.</p>
      </section>
    </main>

    <footer class="capture-bar" aria-label="Drop a thought">
      <p class="capture-bar__success" id="capture-saved" role="status" aria-live="polite" hidden>
        Thought captured.
      </p>
      <textarea
        id="capture-input"
        class="capture-bar__input"
        placeholder="Drop a thought…"
        rows="3"
        aria-label="Drop a thought"
      ></textarea>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
